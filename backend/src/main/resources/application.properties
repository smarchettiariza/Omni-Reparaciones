spring.application.name=backend

# --- Conexion a PostgreSQL: ajusta usuario/password/puerto a tu entorno ---
spring.datasource.url=jdbc:postgresql://localhost:5432/reparaciones_db
spring.datasource.username=postgres
spring.datasource.password=1234

# Las tablas ya se crean con database/schema.sql, asi que Hibernate solo valida
# que las entidades coincidan (no genera ni modifica tablas automaticamente).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false



server.port=8080

# --- Seguridad (login) ---
# Clave secreta usada para firmar los tokens de sesion. Es un ejemplo funcional,
# pero antes de vender/entregar una copia real del sistema, cambiala por una
# frase propia de al menos 32 caracteres (no hace falta que sea "linda", solo larga y unica).
app.jwt.secret=OmniSistemaDeReparaciones2026ClaveSecretaJWTCambiarEnProduccion
# Duracion del token en milisegundos: 86400000 = 24 horas
app.jwt.expiration-ms=86400000